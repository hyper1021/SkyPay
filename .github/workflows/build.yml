name: Build SkyPay Production APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore 2>/dev/null || true
            if [ -s /tmp/release.keystore ]; then
              echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            fi
          fi

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Production Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle not found"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          echo "Built APK files:"
          ls -la "$GITHUB_WORKSPACE/apk-output"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyPay-1.0.0-Release
          path: apk-output/
          if-no-files-found: error
