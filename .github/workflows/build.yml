name: Build SkyPay Production APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 and Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Configure Keystore
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          mkdir -p "$PROJECT_DIR/app"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$PROJECT_DIR/app/skypay-release.keystore" 2>/dev/null || true
            cp "$PROJECT_DIR/app/skypay-release.keystore" "$PROJECT_DIR/skypay-release.keystore" 2>/dev/null || true
          fi

          if [ ! -s "$PROJECT_DIR/app/skypay-release.keystore" ]; then
            FOUND_KS=$(find . -name "skypay-release.keystore" -size +100c | head -n 1)
            if [ -n "$FOUND_KS" ]; then
              echo "Using repository keystore from $FOUND_KS"
              cp "$FOUND_KS" "$PROJECT_DIR/app/skypay-release.keystore"
              cp "$FOUND_KS" "$PROJECT_DIR/skypay-release.keystore"
            else
              echo "Generating fallback release keystore..."
              keytool -genkeypair -v -keystore "$PROJECT_DIR/app/skypay-release.keystore" \
                -alias skypay -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass skypay123456 -keypass skypay123456 \
                -dname "CN=SkyPay, OU=Mobile, O=SkyPay, L=Dhaka, ST=Dhaka, C=BD"
              cp "$PROJECT_DIR/app/skypay-release.keystore" "$PROJECT_DIR/skypay-release.keystore"
            fi
          fi

          echo "KEYSTORE_FILE=$PROJECT_DIR/app/skypay-release.keystore" >> $GITHUB_ENV
          ls -la "$PROJECT_DIR/app/skypay-release.keystore"

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Production APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          echo "Built APK files:"
          ls -la "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyPay-Production-APK
          path: apk-output/
          if-no-files-found: error
