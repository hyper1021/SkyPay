name: Build SkyPay Production APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Keystore Exists
        run: |
          if [ ! -s "app/skypay-release.keystore" ]; then
            if [ -s "skypay-release.keystore" ]; then
              cp skypay-release.keystore app/skypay-release.keystore
            fi
          fi
          KEYSTORE_SECRET="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEYSTORE_SECRET" ] && [ "$KEYSTORE_SECRET" != '""' ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > /tmp/decoded_ks 2>/dev/null || true
            if [ -s "/tmp/decoded_ks" ]; then
              cp /tmp/decoded_ks app/skypay-release.keystore
            fi
            rm -f /tmp/decoded_ks
          fi
          if [ ! -s "app/skypay-release.keystore" ]; then
            echo "Generating production release keystore..."
            keytool -genkeypair -v -keystore app/skypay-release.keystore -alias skypay -keyalg RSA -keysize 2048 -validity 10000 -storepass skypay123456 -keypass skypay123456 -dname "CN=SkyPay, OU=Mobile, O=SkyPay, L=Dhaka, ST=Dhaka, C=BD"
          fi
          cp app/skypay-release.keystore ./skypay-release.keystore 2>/dev/null || true
          ls -la app/skypay-release.keystore

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Production APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle not found"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          echo "Built APK files:"
          ls -la "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyPay-Production-APK
          path: apk-output/
          if-no-files-found: error
