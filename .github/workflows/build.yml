name: Build SkyPay Production APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore 2>/dev/null || true
            if [ -s /tmp/release.keystore ]; then
              echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            fi
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./SkyPay/gradlew" ]; then
            chmod +x ./SkyPay/gradlew
          fi

      - name: Build Production Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./settings.gradle" ]; then
            ./gradlew assembleRelease --stacktrace
          elif [ -f "./SkyPay/settings.gradle" ]; then
            cd SkyPay
            ./gradlew assembleRelease --stacktrace
            cd ..
            mkdir -p app/build/outputs/apk/release/
            cp -r SkyPay/app/build/outputs/apk/release/. app/build/outputs/apk/release/ 2>/dev/null || true
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyPay-1.0.0-Release
          path: |
            app/build/outputs/apk/release/
            SkyPay/app/build/outputs/apk/release/
