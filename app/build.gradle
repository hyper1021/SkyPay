plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pay.sky'
    compileSdk 34

    defaultConfig {
        applicationId "com.pay.sky"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ks = file('skypay-release.keystore')
            if (!ks.exists() || ks.length() == 0) {
                ks = rootProject.file('skypay-release.keystore')
            }
            if (!ks.exists() || ks.length() == 0) {
                ks = rootProject.file('app/skypay-release.keystore')
            }
            def customKeystore = System.getenv("KEYSTORE_FILE")
            if (customKeystore) {
                def cf = file(customKeystore)
                if (!cf.exists()) {
                    cf = rootProject.file(customKeystore)
                }
                if (cf.exists() && cf.length() > 0) {
                    ks = cf
                }
            }

            def sp = System.getenv("KEYSTORE_PASSWORD")
            def storePass = (sp != null && sp.trim().length() > 0) ? sp.trim() : "skypay123456"
            def ka = System.getenv("KEY_ALIAS")
            def alias = (ka != null && ka.trim().length() > 0) ? ka.trim() : "skypay"
            def kp = System.getenv("KEY_PASSWORD")
            def keyPass = (kp != null && kp.trim().length() > 0) ? kp.trim() : "skypay123456"

            boolean canSign = false
            if (ks != null && ks.exists() && ks.length() > 0) {
                try {
                    def keystore = java.security.KeyStore.getInstance("PKCS12")
                    ks.withInputStream { is ->
                        keystore.load(is, storePass.toCharArray())
                    }
                    if (keystore.containsAlias(alias)) {
                        canSign = true
                    }
                } catch (Exception e1) {
                    try {
                        def keystore = java.security.KeyStore.getInstance("JKS")
                        ks.withInputStream { is ->
                            keystore.load(is, storePass.toCharArray())
                        }
                        if (keystore.containsAlias(alias)) {
                            canSign = true
                        }
                    } catch (Exception ignored) {
                    }
                }
            }

            if (canSign) {
                storeFile ks
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreWarnings true
        quiet true
    }
}

afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach {
        enabled = false
    }
}

dependencies {
    implementation "com.airbnb.android:lottie:6.3.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
