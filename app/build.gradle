plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pay.sky'
    compileSdk 34

    defaultConfig {
        applicationId "com.pay.sky"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ks = file('skypay-release.keystore')
            if (!ks.exists() || ks.length() == 0) {
                ks = rootProject.file('skypay-release.keystore')
            }
            if (!ks.exists() || ks.length() == 0) {
                ks = rootProject.file('app/skypay-release.keystore')
            }
            def customKeystore = System.getenv("KEYSTORE_FILE")
            if (customKeystore) {
                def cf = file(customKeystore)
                if (!cf.exists()) {
                    cf = rootProject.file(customKeystore)
                }
                if (cf.exists() && cf.length() > 0) {
                    ks = cf
                }
            }

            if (ks != null && ks.exists() && ks.length() > 0) {
                storeFile ks
                def sp = System.getenv("KEYSTORE_PASSWORD")
                storePassword ((sp != null && sp.trim().length() > 0) ? sp.trim() : "skypay123456")
                def ka = System.getenv("KEY_ALIAS")
                keyAlias ((ka != null && ka.trim().length() > 0) ? ka.trim() : "skypay")
                def kp = System.getenv("KEY_PASSWORD")
                keyPassword ((kp != null && kp.trim().length() > 0) ? kp.trim() : "skypay123456")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists() && signingConfigs.release.storeFile.length() > 0) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreWarnings true
        quiet true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
