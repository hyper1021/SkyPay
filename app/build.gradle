plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pay.sky'
    compileSdk 34

    defaultConfig {
        applicationId "com.pay.sky"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def keyAl = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASSWORD")
            if (keystorePath && file(keystorePath).exists() && storePass && keyAl && keyPass) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias keyAl
                keyPassword keyPass
            } else {
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
