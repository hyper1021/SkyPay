plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pay.sky'
    compileSdk 34

    defaultConfig {
        applicationId "com.pay.sky"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('skypay-release.keystore')
            storePassword "skypay123456"
            keyAlias "skypay"
            keyPassword "skypay123456"

            def customKeystore = System.getenv("KEYSTORE_FILE")
            if (customKeystore && file(customKeystore).exists()) {
                storeFile file(customKeystore)
            }
            def sp = System.getenv("KEYSTORE_PASSWORD")
            if (sp && !sp.trim().isEmpty()) {
                storePassword sp.trim()
            }
            def ka = System.getenv("KEY_ALIAS")
            if (ka && !ka.trim().isEmpty()) {
                keyAlias ka.trim()
            }
            def kp = System.getenv("KEY_PASSWORD")
            if (kp && !kp.trim().isEmpty()) {
                keyPassword kp.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreWarnings true
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("lintVital")) {
        task.enabled = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
